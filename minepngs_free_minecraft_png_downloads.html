<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MinePNGs — Free Minecraft PNG Downloads</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --sky-top:#0d1b3e;--sky-mid:#1a2a5e;--sky-bot:#2c3a7a;
  --card-bg:rgba(20,26,64,0.9);--card-border:#2e3a80;
  --yellow:#f5c842;--cyan:#42e8e0;--purple:#b06ef3;
  --green:#4cffb3;--orange:#ff7f50;--blue:#a8c0ff;
  --text:#d8e0ff;--muted:#8899cc;
}
html,body{height:100%;}
body{
  font-family:'Press Start 2P',monospace;
  background:linear-gradient(180deg,var(--sky-top) 0%,var(--sky-mid) 55%,var(--sky-bot) 100%);
  min-height:100vh;color:var(--text);overflow-x:hidden;
}

.stars{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;}
.star{position:absolute;background:#fff;border-radius:50%;animation:twinkle var(--t,3s) ease-in-out infinite alternate;}
@keyframes twinkle{from{opacity:var(--a1,.2);}to{opacity:var(--a2,.9);}}
.cloud-layer{position:fixed;inset:0;pointer-events:none;z-index:1;overflow:hidden;}
@keyframes driftCloud{from{transform:translateX(110vw);}to{transform:translateX(-500px);}}

nav{position:relative;z-index:50;display:flex;align-items:center;justify-content:center;
  padding:0 28px;height:52px;background:rgba(8,12,40,0.85);backdrop-filter:blur(6px);
  border-bottom:2px solid rgba(100,120,255,0.2);}
.nav-logo{font-family:'Press Start 2P',monospace;font-size:.82rem;color:#e8ecff;text-decoration:none;
  letter-spacing:.05em;text-shadow:0 0 12px rgba(160,140,255,.5);}

.hero{position:relative;z-index:10;text-align:center;padding:44px 24px 28px;}
.hero-box{display:inline-block;border:2px solid rgba(100,100,200,.5);
  background:rgba(10,14,50,.75);padding:18px 44px 14px;margin-bottom:14px;
  box-shadow:0 0 40px rgba(80,60,200,.3);}
.hero-title{font-size:clamp(1.3rem,4vw,2.5rem);color:#f0f4ff;letter-spacing:.05em;
  text-shadow:3px 3px 0 #1a0a60,0 0 28px rgba(140,120,255,.6);}
.hero-badge{display:inline-block;background:#3b2fa0;border:2px solid #6b5aed;
  color:#c8c0ff;font-size:.5rem;letter-spacing:.16em;padding:7px 20px;}
.hero-floats{display:flex;justify-content:center;align-items:flex-end;gap:16px;
  flex-wrap:wrap;margin-top:24px;min-height:70px;}
.hero-floats img{width:56px;height:56px;object-fit:contain;image-rendering:pixelated;
  filter:drop-shadow(0 4px 14px rgba(0,0,0,.8));
  cursor:pointer;
  transition:transform .2s ease, filter .2s ease;
  animation:floatBob var(--fb,3s) ease-in-out infinite alternate;}
.hero-floats img:hover{
  transform:scale(1.18) translateY(-6px);
  filter:drop-shadow(0 0 18px rgba(245,200,66,0.9));
}
.hero-floats img.hero-interact{
  animation:floatInteract 0.65s cubic-bezier(0.175, 0.885, 0.32, 1.25) !important;
}

@keyframes floatBob{from{transform:translateY(0);}to{transform:translateY(-9px);}}

/* Hero interactive bounce animation without shrinking */
@keyframes floatInteract{
  0%{transform:translateY(0) scale(1);filter:drop-shadow(0 4px 14px rgba(0,0,0,.8));}
  25%{transform:translateY(-22px) scale(1.22);filter:drop-shadow(0 0 24px rgba(245,200,66,1));}
  50%{transform:translateY(-28px) scale(1.18);filter:drop-shadow(0 0 28px rgba(66,232,224,1));}
  75%{transform:translateY(-10px) scale(1.08);}
  100%{transform:translateY(0) scale(1);}
}

@keyframes floatToast{
  0%{opacity:1;transform:translate(-50%,0) scale(0.9);}
  50%{opacity:1;transform:translate(-50%,-32px) scale(1.15);}
  100%{opacity:0;transform:translate(-50%,-52px) scale(1);}
}

.wrap{position:relative;z-index:10;max-width:1100px;margin:0 auto;padding:0 22px 80px;}
.sec-hdr{display:flex;align-items:center;gap:10px;margin:36px 0 16px;}
.sec-hdr h2{font-size:.68rem;color:var(--text);letter-spacing:.12em;white-space:nowrap;
  text-shadow:0 0 10px rgba(160,140,255,.4);}
.sec-line{flex:1;height:2px;background:linear-gradient(90deg,rgba(100,120,255,.5),transparent);}
.sec-bar{width:4px;height:22px;flex-shrink:0;}
.sec-icon{width:28px;height:28px;object-fit:contain;image-rendering:pixelated;
  filter:drop-shadow(0 2px 6px rgba(0,0,0,.7));flex-shrink:0;}

/* Section transition animations */
@keyframes secSlideFade {
  0% { opacity: 0; transform: translateY(24px); }
  100% { opacity: 1; transform: translateY(0); }
}

.sec-animate {
  animation: secSlideFade 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

.grid-animate {
  animation: secSlideFade 0.45s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

.pills{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;}
.pill{font-family:'Press Start 2P',monospace;font-size:.48rem;padding:7px 13px;
  border:2px solid var(--card-border);background:rgba(20,26,64,.7);color:var(--muted);
  cursor:pointer;transition:all .15s ease;}
.pill:hover{border-color:var(--yellow);color:var(--yellow);transform:translateY(-1px);}
.pill.on{border-color:var(--yellow);background:rgba(245,200,66,.15);color:var(--yellow);}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(195px,1fr));gap:3px;}
.card{position:relative;background:var(--card-bg);border:2px solid var(--card-border);
  display:flex;flex-direction:column;transition:border-color .15s,background .15s,transform .15s;overflow:hidden;}
.card::before{content:'';position:absolute;inset:0;border-left:3px solid var(--ac,#f5c842);pointer-events:none;}
.card:hover{border-color:rgba(160,140,255,.6);background:rgba(28,36,88,.98);transform:translateY(-2px);}
.card-img{padding:18px 12px 12px;display:grid;place-items:center;min-height:144px;
  background:repeating-conic-gradient(#1c2154 0% 25%,#151a44 0% 50%) 0 0/18px 18px;position:relative;}
.card-img img{width:86px;height:86px;object-fit:contain;image-rendering:pixelated;
  filter:drop-shadow(0 4px 12px rgba(0,0,0,.8));transition:transform .15s;}
.card:hover .card-img img{transform:scale(1.12) translateY(-4px);}

.card-img.enchanted {
  position: relative;
  overflow: hidden;
}

.card-img.enchanted::before {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(circle, rgba(176, 110, 243, 0.45) 0%, rgba(176, 110, 243, 0) 75%);
  pointer-events: none;
  z-index: 1;
}

.card-img.enchanted::after {
  content: '';
  position: absolute;
  inset: -50%;
  background: linear-gradient(45deg, rgba(255,255,255,0) 30%, rgba(220, 140, 255, 0.75) 50%, rgba(255,255,255,0) 70%);
  background-size: 200% 200%;
  animation: enchantedShimmer 1.8s infinite linear;
  pointer-events: none;
  mix-blend-mode: overlay;
  z-index: 2;
}

@keyframes enchantedShimmer {
  0% { background-position: -100% -100%; }
  100% { background-position: 200% 200%; }
}

.card-img img.enchanted-item, .hero-floats img.enchanted-item {
  position: relative;
  z-index: 3;
  filter: drop-shadow(0 0 12px rgba(176, 110, 243, 1)) drop-shadow(0 0 24px rgba(220, 130, 255, 0.85)) drop-shadow(0 4px 12px rgba(0,0,0,.8));
  animation: enchantedGlint 1.8s ease-in-out infinite alternate;
}

@keyframes enchantedGlint {
  0% { filter: drop-shadow(0 0 8px rgba(176, 110, 243, 0.85)) drop-shadow(0 4px 12px rgba(0,0,0,.8)); transform: scale(1); }
  100% { filter: drop-shadow(0 0 22px rgba(230, 160, 255, 1)) drop-shadow(0 0 32px rgba(176, 110, 243, 0.95)) drop-shadow(0 4px 12px rgba(0,0,0,.8)); transform: scale(1.06); }
}

.new-tag{position:absolute;top:8px;right:8px;background:var(--yellow);color:#1a0800;
  font-size:.38rem;padding:4px 8px;}
.card-body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:8px;flex:1;}
.card-name{font-size:.54rem;color:var(--ac,#f5c842);letter-spacing:.04em;line-height:1.7;}
.card-sub{font-family:'VT323',monospace;font-size:.95rem;color:var(--muted);}
.dl{display:flex;align-items:center;justify-content:center;gap:6px;
  border:2px solid var(--ac,#f5c842);color:var(--ac,#f5c842);
  font-family:'Press Start 2P',monospace;font-size:.44rem;padding:8px 10px;
  cursor:pointer;width:100%;background:transparent;transition:all .12s;}
.dl:hover{background:rgba(245,200,66,.16);transform:scale(1.02);}

footer{position:relative;z-index:10;border-top:2px solid rgba(100,120,255,.2);
  text-align:center;padding:26px 20px;background:rgba(8,12,40,.65);}
footer p{font-family:'VT323',monospace;font-size:1rem;color:var(--muted);line-height:1.8;}

@media(max-width:600px){
  .grid{grid-template-columns:repeat(2,1fr);}
  .hero-title{font-size:1.1rem;}
  .hero-floats img{width:40px;height:40px;}
}

  const total = overlaySrc ? 3 : 2;
  const imgSide = new Image();
  const imgTop = new Image();
  const imgOverlay = new Image();

  imgSide.crossOrigin = 'anonymous';
  imgTop.crossOrigin = 'anonymous';
  imgOverlay.crossOrigin = 'anonymous';

  function onImgLoad() {
    loaded++;
    if (loaded < total) return;

    const w = imgSide.width || 16;
    const h = imgSide.height || 16;

    // Create tinted Top Face canvas for Grass Block
    const topCv = document.createElement('canvas');
    topCv.width = w; topCv.height = h;
    const topCtx = topCv.getContext('2d');
    topCtx.drawImage(imgTop, 0, 0);

    if (item.isGrass) {
      topCtx.globalCompositeOperation = 'multiply';
      topCtx.fillStyle = '#7ebd42'; // Minecraft Foliage Green
      topCtx.fillRect(0, 0, w, h);
      topCtx.globalCompositeOperation = 'destination-in';
      topCtx.drawImage(imgTop, 0, 0);
      topCtx.globalCompositeOperation = 'source-over';
    }

    // Create Side Face canvas for Grass Block with overlay
    const sideCv = document.createElement('canvas');
    sideCv.width = w; sideCv.height = h;
    const sideCtx = sideCv.getContext('2d');
    sideCtx.drawImage(imgSide, 0, 0);

    if (item.isGrass && overlaySrc) {
      const ovCv = document.createElement('canvas');
      ovCv.width = w; ovCv.height = h;
      const ovCtx = ovCv.getContext('2d');
      ovCtx.drawImage(imgOverlay, 0, 0);
      ovCtx.globalCompositeOperation = 'multiply';
      ovCtx.fillStyle = '#7ebd42';
      ovCtx.fillRect(0, 0, w, h);
      ovCtx.globalCompositeOperation = 'destination-in';
      ovCtx.drawImage(imgOverlay, 0, 0);

      sideCtx.drawImage(ovCv, 0, 0);
    }

    function drawFace(imgSource, p0, p1, p3, brightness) {
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(p0.x, p0.y);
      ctx.lineTo(p1.x, p1.y);
      ctx.lineTo(p0.x + (p1.x - p0.x) + (p3.x - p0.x), p0.y + (p1.y - p0.y) + (p3.y - p0.y));
      ctx.lineTo(p3.x, p3.y);
      ctx.closePath();
      ctx.clip();

      const m11 = (p1.x - p0.x) / w;
      const m12 = (p1.y - p0.y) / w;
      const m21 = (p3.x - p0.x) / h;
      const m22 = (p3.y - p0.y) / h;

      ctx.transform(m11, m12, m21, m22, p0.x, p0.y);
      ctx.drawImage(imgSource, 0, 0);

      if (brightness < 1.0) {
        ctx.fillStyle = `rgba(0,0,0,${1 - brightness})`;
        ctx.fillRect(0, 0, w, h);
      }
      ctx.restore();
    }

    // Top Face
    drawFace(topCv, {x:64, y:18}, {x:102, y:40}, {x:26, y:40}, 1.0);
    // Left Face
    drawFace(sideCv, {x:26, y:40}, {x:64, y:62}, {x:26, y:86}, 0.82);
    // Right Face
    drawFace(sideCv, {x:64, y:62}, {x:102, y:40}, {x:64, y:108}, 0.62);

    const dataUrl = cv.toDataURL('image/png');
    BLOCK_3D_CACHE[cacheKey] = dataUrl;
    callback(dataUrl);
  }

  imgSide.onload = onImgLoad;
  imgTop.onload = onImgLoad;
  if(overlaySrc) imgOverlay.onload = onImgLoad;

  imgSide.onerror = () => callback(sideSrc);
  imgTop.onerror = () => callback(sideSrc);

  imgSide.src = sideSrc;
  imgTop.src = topSrc;
  if(overlaySrc) imgOverlay.src = overlaySrc;
}

const MOB_3D_CACHE = {};

function render3DMobCanvas(item, callback) {
  if (MOB_3D_CACHE[item.name]) {
    callback(MOB_3D_CACHE[item.name]);
    return;
  }

  const cv = document.createElement('canvas');
  cv.width = 128;
  cv.height = 128;
  const ctx = cv.getContext('2d');
  ctx.imageSmoothingEnabled = false;

  const cx = 64, cy = 102;
  const scale = 1.35;

  function project(x, y, z) {
    return {
      x: cx + (x - z) * 0.866 * scale,
      y: cy - (y - (x + z) * 0.5) * scale
    };
  }

  // Create pixel-textured canvas face with Minecraft multi-shade pixel noise
  function makeTex(w, h, baseColor, noiseRange, drawFn) {
    const tc = document.createElement('canvas');
    tc.width = w; tc.height = h;
    const tctx = tc.getContext('2d');
    tctx.imageSmoothingEnabled = false;

    let r = 128, g = 128, b = 128;
    if (baseColor.startsWith('#')) {
      const hex = baseColor.slice(1);
      if (hex.length === 3) {
        r = parseInt(hex[0] + hex[0], 16);
        g = parseInt(hex[1] + hex[1], 16);
        b = parseInt(hex[2] + hex[2], 16);
      } else if (hex.length === 6) {
        r = parseInt(hex.slice(0, 2), 16);
        g = parseInt(hex.slice(2, 4), 16);
        b = parseInt(hex.slice(4, 6), 16);
      }
    }

    const imgData = tctx.createImageData(w, h);
    for (let i = 0; i < w * h; i++) {
      const noise = (Math.random() - 0.5) * noiseRange;
      imgData.data[i * 4]     = Math.min(255, Math.max(0, r + noise));
      imgData.data[i * 4 + 1] = Math.min(255, Math.max(0, g + noise));
      imgData.data[i * 4 + 2] = Math.min(255, Math.max(0, b + noise));
      imgData.data[i * 4 + 3] = 255;
    }
    tctx.putImageData(imgData, 0, 0);

    if (drawFn) drawFn(tctx, w, h);
    return tc;
  }

  function drawTexturedBox(x, y, z, wx, wy, wz, topTex, leftTex, rightTex) {
    const p0 = project(x, y, z);
    const p1 = project(x + wx, y, z);
    const p2 = project(x + wx, y, z + wz);
    const p3 = project(x, y, z + wz);

    const p4 = project(x, y + wy, z);
    const p5 = project(x + wx, y + wy, z);
    const p6 = project(x + wx, y + wy, z + wz);
    const p7 = project(x, y + wy, z + wz);

    function mapFace(img, pA, pB, pD, brightness) {
      if (!img) return;
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(pA.x, pA.y);
      ctx.lineTo(pB.x, pB.y);
      ctx.lineTo(pA.x + (pB.x - pA.x) + (pD.x - pA.x), pA.y + (pB.y - pA.y) + (pD.y - pA.y));
      ctx.lineTo(pD.x, pD.y);
      ctx.closePath();
      ctx.clip();

      const w = img.width, h = img.height;
      const m11 = (pB.x - pA.x) / w;
      const m12 = (pB.y - pA.y) / w;
      const m21 = (pD.x - pA.x) / h;
      const m22 = (pD.y - pA.y) / h;

      ctx.transform(m11, m12, m21, m22, pA.x, pA.y);
      ctx.drawImage(img, 0, 0);

      if (brightness < 1.0) {
        ctx.fillStyle = `rgba(0,0,0,${1 - brightness})`;
        ctx.fillRect(0, 0, w, h);
      }
      ctx.restore();
    }

    mapFace(topTex, p4, p5, p7, 1.0);
    mapFace(leftTex, p3, p2, p7, 0.82);
    mapFace(rightTex, p1, p2, p5, 0.65);
  }

  ctx.save();
  const t = item.mobType;

  if (t === 'creeper') {
    const greenBody = makeTex(8, 8, '#52c942', 35);
    const creeperFace = makeTex(8, 8, '#5cdb4b', 25, (tctx) => {
      tctx.fillStyle = '#1b3815';
      tctx.fillRect(1, 2, 2, 2);
      tctx.fillRect(5, 2, 2, 2);
      tctx.fillRect(3, 3, 2, 3);
      tctx.fillRect(2, 4, 1, 3);
      tctx.fillRect(5, 4, 1, 3);
    });

    drawTexturedBox(-8, 0, -8, 6, 8, 6, greenBody, greenBody, greenBody);
    drawTexturedBox(2, 0, -8, 6, 8, 6, greenBody, greenBody, greenBody);
    drawTexturedBox(-8, 0, 2, 6, 8, 6, greenBody, greenBody, greenBody);
    drawTexturedBox(2, 0, 2, 6, 8, 6, greenBody, greenBody, greenBody);
    drawTexturedBox(-6, 8, -4, 12, 18, 8, greenBody, greenBody, greenBody);
    drawTexturedBox(-8, 26, -6, 16, 16, 12, greenBody, greenBody, creeperFace);

  } else if (t === 'zombie' || t === 'steve') {
    const isZombie = (t === 'zombie');
    const skinTex = isZombie ? makeTex(8, 8, '#49a049', 30) : makeTex(8, 8, '#c28d63', 25);
    const shirtTex = isZombie ? makeTex(8, 8, '#2b8282', 25) : makeTex(8, 8, '#00a8ad', 25);
    const pantsTex = makeTex(8, 8, '#293d80', 20);

    const headFace = isZombie ?
      makeTex(8, 8, '#49a049', 30, (tctx) => {
        tctx.fillStyle = '#183818';
        tctx.fillRect(1, 2, 2, 2); tctx.fillRect(5, 2, 2, 2);
        tctx.fillRect(3, 5, 2, 1);
      }) :
      makeTex(8, 8, '#c28d63', 25, (tctx) => {
        tctx.fillStyle = '#593f2b'; tctx.fillRect(0, 0, 8, 2);
        tctx.fillStyle = '#ffffff'; tctx.fillRect(1, 3, 1, 1); tctx.fillRect(5, 3, 1, 1);
        tctx.fillStyle = '#2b52a0'; tctx.fillRect(2, 3, 1, 1); tctx.fillRect(6, 3, 1, 1);
        tctx.fillStyle = '#a87148'; tctx.fillRect(3, 4, 2, 1);
        tctx.fillStyle = '#422b1b'; tctx.fillRect(2, 5, 4, 1);
      });

    drawTexturedBox(-6, 0, -3, 12, 18, 6, pantsTex, pantsTex, pantsTex);
    drawTexturedBox(-8, 18, -4, 16, 18, 8, shirtTex, shirtTex, shirtTex);

    if (isZombie) {
      drawTexturedBox(8, 24, -4, 6, 6, 18, skinTex, skinTex, skinTex);

    } else {
      drawTexturedBox(8, 18, -3, 6, 18, 6, skinTex, skinTex, skinTex);
      drawTexturedBox(-14, 18, -3, 6, 18, 6, skinTex, skinTex, skinTex);
    }
    drawTexturedBox(-8, 36, -6, 16, 16, 12, skinTex, skinTex, headFace);

  } else if (t === 'skeleton' || t === 'wither_skeleton') {
    const isWither = (t === 'wither_skeleton');
    const boneTex = isWither ? makeTex(8, 8, '#2b2b2b', 20) : makeTex(8, 8, '#d1d1d1', 25);
    const headFace = isWither ?
      makeTex(8, 8, '#2b2b2b', 20, (tctx) => {
        tctx.fillStyle = '#111111';
        tctx.fillRect(1, 2, 2, 2); tctx.fillRect(5, 2, 2, 2);
        tctx.fillRect(3, 4, 2, 1); tctx.fillRect(2, 6, 4, 1);
      }) :
      makeTex(8, 8, '#d1d1d1', 25, (tctx) => {
        tctx.fillStyle = '#1a1a1a';
        tctx.fillRect(1, 2, 2, 2); tctx.fillRect(5, 2, 2, 2);

      });

    drawTexturedBox(-4, 0, -2, 8, 18, 4, boneTex, boneTex, boneTex);
    drawTexturedBox(-6, 18, -3, 12, 18, 6, boneTex, boneTex, boneTex);
    drawTexturedBox(-8, 36, -6, 16, 16, 12, boneTex, boneTex, headFace);

  } else if (t === 'enderman') {
    const enderTex = makeTex(8, 8, '#121118', 25);
    const enderFace = makeTex(8, 8, '#121118', 25, (tctx) => {
      tctx.fillStyle = '#d842ff';
      tctx.fillRect(0, 4, 8, 1);
      tctx.fillStyle = '#ffffff';
      tctx.fillRect(2, 4, 1, 1); tctx.fillRect(5, 4, 1, 1);
    });

    drawTexturedBox(-3, 0, -2, 6, 28, 4, enderTex, enderTex, enderTex);
    drawTexturedBox(-4, 28, -3, 8, 22, 6, enderTex, enderTex, enderTex);
    drawTexturedBox(-6, 50, -5, 12, 12, 10, enderTex, enderTex, enderFace);

  } else if (t === 'pig') {
    const pigSkin = makeTex(8, 8, '#ffaec6', 20);
    const pigFace = makeTex(8, 8, '#ffaec6', 20, (tctx) => {
      tctx.fillStyle = '#ffffff'; tctx.fillRect(0, 3, 2, 1); tctx.fillRect(6, 3, 2, 1);
      tctx.fillStyle = '#000000'; tctx.fillRect(0, 3, 1, 1); tctx.fillRect(7, 3, 1, 1);
    });
    const snoutTex = makeTex(4, 3, '#ff80a5', 15, (tctx) => {
      tctx.fillStyle = '#cf597d'; tctx.fillRect(0, 1, 1, 1); tctx.fillRect(3, 1, 1, 1);
    });

    drawTexturedBox(-8, 0, -12, 6, 8, 6, pigSkin, pigSkin, pigSkin);
    drawTexturedBox(2, 0, -12, 6, 8, 6, pigSkin, pigSkin, pigSkin);
    drawTexturedBox(-8, 0, 6, 6, 8, 6, pigSkin, pigSkin, pigSkin);
    drawTexturedBox(2, 0, 6, 6, 8, 6, pigSkin, pigSkin, pigSkin);
    drawTexturedBox(-8, 8, -14, 16, 14, 24, pigSkin, pigSkin, pigSkin);
    drawTexturedBox(-7, 14, 10, 14, 12, 10, pigSkin, pigSkin, pigFace);
    drawTexturedBox(-4, 16, 20, 8, 5, 4, snoutTex, snoutTex, snoutTex);

  } else if (t === 'cow') {
    const cowSkin = makeTex(8, 8, '#5e4331', 25, (tctx) => {
      tctx.fillStyle = '#e6e6e6'; tctx.fillRect(1, 1, 3, 3); tctx.fillRect(4, 5, 3, 2);
    });
    const hornTex = makeTex(4, 4, '#e6e6e6', 15);
    const cowFace = makeTex(8, 8, '#5e4331', 20, (tctx) => {
      tctx.fillStyle = '#ffffff'; tctx.fillRect(0, 2, 2, 1); tctx.fillRect(6, 2, 2, 1);
      tctx.fillStyle = '#000000'; tctx.fillRect(1, 2, 1, 1); tctx.fillRect(6, 2, 1, 1);
      tctx.fillStyle = '#c9a38b'; tctx.fillRect(2, 4, 4, 3);
    });

    drawTexturedBox(-8, 0, -12, 6, 10, 6, cowSkin, cowSkin, cowSkin);
    drawTexturedBox(2, 0, -12, 6, 10, 6, cowSkin, cowSkin, cowSkin);
    drawTexturedBox(-8, 0, 6, 6, 10, 6, cowSkin, cowSkin, cowSkin);
    drawTexturedBox(2, 0, 6, 6, 10, 6, cowSkin, cowSkin, cowSkin);
    drawTexturedBox(-9, 10, -14, 18, 14, 24, cowSkin, cowSkin, cowSkin);
    drawTexturedBox(-7, 18, 10, 14, 12, 10, cowSkin, cowSkin, cowFace);
    drawTexturedBox(-9, 28, 12, 3, 5, 3, hornTex, hornTex, hornTex);
    drawTexturedBox(6, 28, 12, 3, 5, 3, hornTex, hornTex, hornTex);

  } else if (t === 'sheep') {
    const woolTex = makeTex(8, 8, '#f0f0f0', 35);
    const skinTex = makeTex(8, 8, '#dbb998', 15);
    const sheepFace = makeTex(8, 8, '#dbb998', 15, (tctx) => {

      tctx.fillStyle = '#000000'; tctx.fillRect(1, 2, 1, 1); tctx.fillRect(6, 2, 1, 1);

    });

    drawTexturedBox(-7, 0, -10, 5, 8, 5, skinTex, skinTex, skinTex);
    drawTexturedBox(2, 0, -10, 5, 8, 5, skinTex, skinTex, skinTex);
    drawTexturedBox(-7, 0, 5, 5, 8, 5, skinTex, skinTex, skinTex);
    drawTexturedBox(2, 0, 5, 5, 8, 5, skinTex, skinTex, skinTex);
    drawTexturedBox(-9, 8, -14, 18, 16, 24, woolTex, woolTex, woolTex);
    drawTexturedBox(-6, 16, 10, 12, 10, 10, woolTex, woolTex, sheepFace);

  } else if (t === 'chicken') {
    const featherTex = makeTex(8, 8, '#ffffff', 20);
    const beakTex = makeTex(4, 4, '#f5a727', 15);
    const wattleTex = makeTex(4, 4, '#ff3b3b', 15);
    const chkFace = makeTex(8, 8, '#ffffff', 20, (tctx) => {
      tctx.fillStyle = '#000000'; tctx.fillRect(1, 2, 1, 2); tctx.fillRect(6, 2, 1, 2);
    });

    drawTexturedBox(-3, 0, -2, 2, 6, 2, beakTex, beakTex, beakTex);
    drawTexturedBox(1, 0, -2, 2, 6, 2, beakTex, beakTex, beakTex);
    drawTexturedBox(-6, 6, -8, 12, 10, 12, featherTex, featherTex, featherTex);
    drawTexturedBox(-4, 16, 0, 8, 10, 6, featherTex, featherTex, chkFace);
    drawTexturedBox(-2, 18, 6, 4, 3, 4, beakTex, beakTex, beakTex);
    drawTexturedBox(-1, 15, 6, 2, 3, 2, wattleTex, wattleTex, wattleTex);

  } else if (t === 'villager' || t === 'witch') {
    const isWitch = (t === 'witch');
    const robeTex = isWitch ? makeTex(8, 8, '#40255c', 20) : makeTex(8, 8, '#73462c', 20);
    const skinTex = isWitch ? makeTex(8, 8, '#5ba65b', 20) : makeTex(8, 8, '#a17050', 20);

    drawTexturedBox(-6, 0, -4, 12, 26, 8, robeTex, robeTex, robeTex);
    drawTexturedBox(-7, 26, -5, 14, 14, 10, skinTex, skinTex, vilFace);

    drawTexturedBox(-7, 10, -10, 14, 12, 20, beeTex, beeTex, beeTex);
    drawTexturedBox(-12, 22, -4, 5, 1, 10, wingTex, wingTex, wingTex);
    drawTexturedBox(7, 22, -4, 5, 1, 10, wingTex, wingTex, wingTex);

  } else if (t === 'warden') {
    const wardTex = makeTex(8, 8, '#092b36', 30);
    const chestTex = makeTex(8, 8, '#0c3a4a', 30, (tctx) => {
      tctx.fillStyle = '#00f0ff'; tctx.fillRect(2, 2, 4, 1); tctx.fillRect(2, 4, 4, 1);
    });
    const hornTex = makeTex(4, 4, '#00f0ff', 20);

    drawTexturedBox(-8, 0, -4, 16, 20, 8, wardTex, wardTex, wardTex);
    drawTexturedBox(-10, 20, -5, 20, 22, 10, wardTex, wardTex, chestTex);
    drawTexturedBox(-9, 42, -7, 18, 16, 14, wardTex, wardTex, wardTex);
    drawTexturedBox(-14, 56, -3, 5, 10, 2, hornTex, hornTex, hornTex);
    drawTexturedBox(9, 56, -3, 5, 10, 2, hornTex, hornTex, hornTex);

  } else if (t === 'golem') {
    const golemTex = makeTex(8, 8, '#d1cca8', 25, (tctx) => {
      tctx.fillStyle = '#5c8a47'; tctx.fillRect(1, 4, 2, 3); tctx.fillRect(5, 1, 2, 2);
    });
    const noseTex = makeTex(4, 4, '#b83b3b', 15);

    drawTexturedBox(-8, 0, -4, 16, 22, 8, golemTex, golemTex, golemTex);
    drawTexturedBox(-12, 22, -6, 24, 26, 12, golemTex, golemTex, golemTex);
    drawTexturedBox(-8, 48, -6, 16, 16, 12, golemTex, golemTex, golemTex);
    drawTexturedBox(-2, 52, 6, 4, 7, 3, noseTex, noseTex, noseTex);

  } else {
    const defTex = makeTex(8, 8, item.c || '#42e8e0', 30);
    drawTexturedBox(-8, 10, -8, 16, 16, 16, defTex, defTex, defTex);
  }

  ctx.restore();
  const dataUrl = cv.toDataURL('image/png');
  MOB_3D_CACHE[item.name] = dataUrl;
  callback(dataUrl);
}

async function download(item, isBlock=false, isMob=false){
  let src = imgUrl(item.f);
  if(isBlock){
    const sideSrc = imgUrl(item.f);
    const topSrc = imgUrl(item.top || item.f);
    const cacheKey = sideSrc + '|' + topSrc + '|' + (item.overlay?imgUrl(item.overlay):'');
    if(BLOCK_3D_CACHE[cacheKey]){
      src = BLOCK_3D_CACHE[cacheKey];
    }
  } else if(isMob && MOB_3D_CACHE[item.name]){
    src = MOB_3D_CACHE[item.name];
  }

  try{
    const r = await fetch(src, {mode:'cors'});
    if(!r.ok) throw 0;
    const blob = await r.blob();
    const a = Object.assign(document.createElement('a'),{href:URL.createObjectURL(blob),download:item.name.replace(/\s+/g,'_')+'_3D.png'});
    document.body.appendChild(a); a.click(); a.remove();
  } catch { window.open(src,'_blank'); }
}

function makeCard(item, isBlock=false, isMob=false){
  const d = document.createElement('div');
  d.className = 'card';
  d.style.setProperty('--ac', item.c);
  const imgClass = item.enchanted ? 'class="enchanted-item"' : '';
  const imgTag = `<img src="${imgUrl(item.f)}" ${imgClass} alt="${item.name}" loading="lazy" onerror="this.style.opacity='.15'">`;
  d.innerHTML = `
    <div class="card-img ${item.enchanted ? 'enchanted' : ''}">
      ${item.n?'<span class="new-tag">NEW</span>':''}
      ${imgTag}
    </div>
    <div class="card-body">
      <div class="card-name">${item.name}</div>
      <div class="card-sub">${(isBlock || isMob) ? '3D Isometric PNG' : 'Transparent PNG · No BG'}</div>
      <button class="dl" style="border-color:${item.c};color:${item.c}">${dlIcon(item.c)} Download PNG</button>
    </div>`;

  const imgEl = d.querySelector('.card-img img');
  if(isBlock){
    render3DBlockCanvas(item, (dataUrl) => {
      imgEl.src = dataUrl;
    });
  } else if(isMob) {
    render3DMobCanvas(item, (dataUrl) => {
      imgEl.src = dataUrl;
    });
  }

  d.querySelector('.dl').onclick = () => download(item, isBlock, isMob);
  return d;
}

    for (let i = 0; i < 10; i++) {
      const p = document.createElement('div');
      const color = colors[Math.floor(Math.random() * colors.length)];
      const dx = (Math.random() - 0.5) * 100;
      const dy = (Math.random() - 0.7) * 100;
      p.style.cssText = `
        position: fixed;
        left: ${centerX}px;
        top: ${centerY}px;
        width: 6px;
        height: 6px;
        background: ${color};
        pointer-events: none;
        z-index: 999;
        box-shadow: 0 0 8px ${color};
        transform: translate(0, 0) scale(1);
        transition: transform 0.65s cubic-bezier(0.1, 0.8, 0.3, 1), opacity 0.65s ease;
      `;
      document.body.appendChild(p);
      requestAnimationFrame(() => {
        p.style.transform = `translate(${dx}px, ${dy}px) scale(0)`;
        p.style.opacity = '0';
      });
      setTimeout(() => p.remove(), 700);
    }

    // Show floating toast badge
    const toast = document.createElement('div');
    toast.textContent = item.name;
    toast.style.cssText = `
      position: fixed;
      left: ${centerX}px;
      top: ${centerY - 20}px;
      transform: translate(-50%, 0);
      color: #f5c842;
      font-family: 'Press Start 2P', monospace;
      font-size: 0.58rem;
      pointer-events: none;
      z-index: 1000;
      text-shadow: 2px 2px 0 #000;
      animation: floatToast 0.85s ease-out forwards;
    `;
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 850);
  });
}

function render(){
  // Section header icons
  Object.entries(SECTION_ICONS).forEach(([cat, f]) => {
    const el = document.getElementById('si-'+cat);
    if(el){
      if(cat === 'blocks'){
        render3DBlockCanvas({f:f, top:'block/grass_block_top', overlay:'block/grass_block_side_overlay', isGrass:true}, (dataUrl) => { el.src = dataUrl; });
      } else if(cat === 'mobs') {
        render3DMobCanvas({name:'Creeper', mobType:'creeper', f:'item/creeper_head'}, (dataUrl) => { el.src = dataUrl; });
      } else {
        el.src = imgUrl(f); el.onerror = () => el.style.display='none';
      }
    }
  });

  // Cards
  CATS.forEach(cat => {
    const g = document.getElementById('grid-'+cat);
    if(g){
      g.innerHTML = '';
      const isBlockCat = (cat === 'blocks');
      const isMobCat = (cat === 'mobs');
      DATA[cat].forEach(item => g.appendChild(makeCard(item, isBlockCat, isMobCat)));
    }
  });

  // Hero floats
  const hf = document.getElementById('hf');
  if(hf){
    hf.innerHTML = '';
    HERO_FLOATS.forEach((item, i) => {
      const img = document.createElement('img');
      img.alt = item.name;
      if (item.enchanted) img.classList.add('enchanted-item');
      img.style.cssText = `--fb:${(2.5+i*.28).toFixed(1)}s;animation-delay:${(i*.22).toFixed(1)}s`;

      if(item.isBlock){
        render3DBlockCanvas(item, (dataUrl) => {
          img.src = dataUrl;
        });
      } else {
        img.src = imgUrl(item.f);
      }

      img.onerror = () => img.remove();
      setupHeroFloatInteractions(img, item);
      hf.appendChild(img);
    });
  }
}

function filt(cat, btn){
  document.querySelectorAll('.pill').forEach(b => b.classList.remove('on'));
  btn.classList.add('on');

  CATS.forEach(c => {
    const show = (cat==='all' || cat===c);
    const sec = document.getElementById('sec-'+c);
    const grid = document.getElementById('grid-'+c);

    if(sec) {
      sec.style.display = show ? '' : 'none';
      if(show){
        sec.classList.remove('sec-animate');
        void sec.offsetWidth; // trigger reflow for smooth animation
        sec.classList.add('sec-animate');
      }
    }
    if(grid) {
      grid.style.display = show ? '' : 'none';
      if(show){
        grid.classList.remove('grid-animate');
        void grid.offsetWidth; // trigger reflow for smooth animation
        grid.classList.add('grid-animate');
      }
    }
  });
}

// STARS
(function(){
  const el = document.getElementById('stars');
  for(let i=0;i<160;i++){
    const s = document.createElement('div');
    s.className = 'star';
    const sz = Math.random()*2.2+0.6;
    s.style.cssText=`left:${Math.random()*100}%;top:${Math.random()*100}%;width:${sz}px;height:${sz}px;--t:${(Math.random()*3+1.5).toFixed(1)}s;--a1:${(Math.random()*.3+.1).toFixed(2)};--a2:${(Math.random()*.5+.4).toFixed(2)};animation-delay:${(Math.random()*4).toFixed(1)}s`;
    el.appendChild(s);
  }
})();

// PIXEL CLOUDS
(function(){
  const layer = document.getElementById('clouds');
  const pats=[
    [[0,1],[1,1],[2,1],[3,1],[4,1],[5,1],[1,0],[2,0],[3,0],[4,0],[2,-1],[3,-1]],
    [[0,1],[1,1],[2,1],[3,1],[1,0],[2,0],[4,1],[5,1],[3,0]],
    [[0,2],[1,2],[2,2],[3,2],[4,2],[5,2],[6,2],[7,2],[1,1],[2,1],[3,1],[4,1],[5,1],[6,1],[2,0],[3,0],[4,0]],
  ];
  [{top:'7%',s:2.3,o:.17,d:88},{top:'14%',s:1.8,o:.13,d:116},{top:'22%',s:3.1,o:.14,d:96},
   {top:'5%',s:2.0,o:.11,d:132},{top:'30%',s:1.5,o:.10,d:77},{top:'19%',s:2.7,o:.15,d:105}]
  .forEach((cfg,i)=>{
    const pat=pats[i%pats.length], u=8*cfg.s;
    const cols=Math.max(...pat.map(p=>p[0]))+1;
    const rows=Math.max(...pat.map(p=>p[1]))+2;
    const wrap=document.createElement('div');
    wrap.style.cssText=`position:absolute;top:${cfg.top};left:0;width:${cols*u}px;height:${rows*u}px;opacity:${cfg.o};animation:driftCloud ${cfg.d}s linear infinite;animation-delay:${(-Math.random()*cfg.d).toFixed(0)}s`;
    const cv=document.createElement('canvas');
    cv.width=cols*u; cv.height=rows*u;
    cv.style.cssText='image-rendering:pixelated;display:block;width:100%;height:100%';
    const ctx=cv.getContext('2d');
    ctx.fillStyle='#aabbee';
    pat.forEach(([c,r])=>ctx.fillRect(c*u,r*u,u,u));
    ctx.fillStyle='#ccd8ff';
    pat.filter(([c,r])=>!pat.some(([cc,rr])=>cc===c&&rr===r-1))
       .forEach(([c,r])=>ctx.fillRect(c*u,r*u,u,u*.3));
    wrap.appendChild(cv); layer.appendChild(wrap);
  });
})();

render();
</script>
